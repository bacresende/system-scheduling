<h1 class="mb-4 text-3xl font-bold">Anamnese facial</h1>
<app-request-feedback />
<form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4 rounded-xl bg-white p-4" novalidate>
  <div><label for="pele">Tipo de pele</label><p-select inputId="pele" formControlName="tipoPele" [options]="tipos" styleClass="mt-1 w-full md:w-64" /><app-field-error [control]="form.controls.tipoPele" /></div>
  <div class="flex items-center gap-2"><p-checkbox inputId="acidos" formControlName="usaAcidos" [binary]="true" /><label for="acidos">Usa ácidos?</label></div>
  @if (form.controls.usaAcidos.value) {
    <label>Quais ácidos? <input pInputText formControlName="quaisAcidos" class="mt-1 w-full" /></label>
    @if (form.hasError('acidos') && (form.controls.quaisAcidos.dirty || form.controls.quaisAcidos.touched)) {
      <p role="alert" class="text-red-800">Informe quais ácidos utiliza.</p>
    }
  }
  <div class="flex items-center gap-2"><p-checkbox inputId="sol" formControlName="sensibilidadeSol" [binary]="true" /><label for="sol">Sensibilidade ao sol?</label></div>
  <p-button type="submit" label="Salvar ficha" [loading]="state.busy()" [disabled]="!context.editable()" styleClass="w-full md:w-auto bg-estetica-primary text-estetica-text border-estetica-primary" />
</form>
