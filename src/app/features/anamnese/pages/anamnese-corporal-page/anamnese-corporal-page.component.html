<h1 class="mb-4 text-3xl font-bold">Anamnese corporal</h1>
<app-request-feedback />
<form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4 rounded-xl bg-white p-4">
  @for (field of fields; track field.key) {
    <div class="flex items-center gap-2">
      <p-checkbox [inputId]="field.key" [formControlName]="field.key" [binary]="true" />
      <label [for]="field.key">{{ field.label }}</label>
    </div>
  }
  <p-button type="submit" label="Salvar ficha" [loading]="state.busy()" [disabled]="!context.editable()" styleClass="w-full md:w-auto bg-estetica-primary text-estetica-text border-estetica-primary" />
</form>
