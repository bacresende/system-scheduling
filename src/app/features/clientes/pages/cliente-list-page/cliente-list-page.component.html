<h1 class="mb-4 text-3xl font-bold">Clientes</h1>
<app-request-feedback />
<form [formGroup]="form" (ngSubmit)="save()" class="mb-8 grid gap-4 rounded-2xl bg-white p-4 md:grid-cols-3" novalidate>
  <label>Nome <input pInputText formControlName="nome" autocomplete="name" class="mt-1 w-full" /><app-field-error [control]="form.controls.nome" /></label>
  <label>E-mail <input pInputText type="email" formControlName="email" autocomplete="email" class="mt-1 w-full" /><app-field-error [control]="form.controls.email" /></label>
  <label>WhatsApp com DDI <input pInputText type="tel" formControlName="telefone" autocomplete="tel" class="mt-1 w-full" /><app-field-error [control]="form.controls.telefone" /></label>
  <p-button type="submit" label="Cadastrar cliente" [loading]="state.busy()" styleClass="w-full md:w-auto bg-estetica-primary text-estetica-text border-estetica-primary" />
</form>
<p-button label="Atualizar lista" severity="secondary" (onClick)="load()" [disabled]="state.busy()" styleClass="mb-4" />
<p-table [value]="clientes()" [scrollable]="true" styleClass="w-full">
  <ng-template #header><tr><th>Nome</th><th>E-mail</th><th>WhatsApp</th><th>Cadastro</th></tr></ng-template>
  <ng-template #body let-item><tr><td>{{ item.nome }}</td><td>{{ item.email }}</td><td>{{ item.telefone }}</td><td>{{ item.cadastroCompleto ? 'Completo' : 'Pendente' }}</td></tr></ng-template>
  <ng-template #emptymessage><tr><td colspan="4">Nenhum cliente carregado.</td></tr></ng-template>
</p-table>
