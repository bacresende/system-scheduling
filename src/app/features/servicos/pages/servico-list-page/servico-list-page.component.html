<h1 class="mb-4 text-3xl font-bold">Serviços</h1>
<app-request-feedback />
<form [formGroup]="form" (ngSubmit)="save()" class="mb-8 grid gap-4 rounded-2xl bg-white p-4 md:grid-cols-2" novalidate>
  <h2 class="text-xl font-semibold md:col-span-2">{{ editing() ? 'Editar serviço' : 'Novo serviço' }}</h2>
  <label>Nome <input pInputText formControlName="nome" class="mt-1 w-full" /><app-field-error [control]="form.controls.nome" /></label>
  <label>Descrição <input pInputText formControlName="descricao" class="mt-1 w-full" /></label>
  <div><label for="preco">Preço (R$)</label><p-inputnumber inputId="preco" formControlName="preco" [min]="0" [maxFractionDigits]="2" styleClass="mt-1 w-full" /><app-field-error [control]="form.controls.preco" /></div>
  <div><label for="duracao">Duração (minutos)</label><p-inputnumber inputId="duracao" formControlName="duracaoMinutos" [min]="1" [useGrouping]="false" styleClass="mt-1 w-full" /><app-field-error [control]="form.controls.duracaoMinutos" /></div>
  <div><label for="tipo">Tipo de anamnese</label><p-select inputId="tipo" [options]="tipos" formControlName="tipoAnamneseExigida" styleClass="mt-1 w-full" /></div>
  <div><label for="retorno">Dias para retorno (opcional)</label><p-inputnumber inputId="retorno" formControlName="diasParaRetorno" [min]="1" [useGrouping]="false" styleClass="mt-1 w-full" /><app-field-error [control]="form.controls.diasParaRetorno" /></div>
  <div class="flex items-center gap-2"><p-checkbox inputId="ativo" formControlName="ativo" [binary]="true" /><label for="ativo">Ativo</label></div>
  <div class="flex flex-col gap-2 md:col-span-2 md:flex-row">
    <p-button type="submit" label="Salvar" [loading]="state.busy()" styleClass="w-full md:w-auto bg-estetica-primary text-estetica-text border-estetica-primary" />
    @if (editing()) { <p-button label="Cancelar edição" severity="secondary" (onClick)="reset()" /> }
  </div>
</form>
<p-button label="Atualizar lista" severity="secondary" (onClick)="load()" [disabled]="state.busy()" styleClass="mb-4" />
<p-table [value]="servicos()" [scrollable]="true" styleClass="w-full">
  <ng-template #header><tr><th>Nome</th><th>Preço</th><th>Duração</th><th>Status</th><th>Ações</th></tr></ng-template>
  <ng-template #body let-item>
    <tr><td>{{ item.nome }}</td><td>{{ item.preco | currency:'BRL' }}</td><td>{{ item.duracaoMinutos }} min</td><td>{{ item.ativo ? 'Ativo' : 'Inativo' }}</td>
      <td><div class="flex gap-2"><p-button label="Editar" [ariaLabel]="'Editar ' + item.nome" (onClick)="edit(item)" [disabled]="state.busy()" />
      @if (item.ativo) { <p-button label="Inativar" severity="secondary" [ariaLabel]="'Inativar ' + item.nome" (onClick)="deactivate(item)" [disabled]="state.busy()" /> }</div></td></tr>
  </ng-template>
  <ng-template #emptymessage><tr><td colspan="5">Nenhum serviço carregado.</td></tr></ng-template>
</p-table>
