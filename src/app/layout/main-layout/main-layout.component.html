<div class="min-h-dvh bg-estetica-bg text-estetica-text md:flex">
  <a href="#conteudo" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:bg-white focus:p-4">Pular para conteúdo</a>
  <aside class="border-b border-estetica-secondary bg-white p-4 md:w-64 md:shrink-0 md:border-r">
    <p class="mb-4 text-xl font-bold">Clínica de estética</p>
    <nav aria-label="Navegação principal" class="flex flex-wrap gap-2 md:flex-col">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="bg-estetica-secondary" ariaCurrentWhenActive="page" class="rounded-xl p-3 hover:bg-estetica-secondary focus-visible:outline-2 focus-visible:outline-estetica-text">{{ item.label }}</a>
      }
    </nav>
    <p-button label="Sair" severity="secondary" (onClick)="logout()" [disabled]="state.busy()" styleClass="mt-4 w-full md:w-auto" />
    <app-request-feedback />
  </aside>
  <main id="conteudo" tabindex="-1" class="min-w-0 flex-1 p-4 md:p-8">
    <router-outlet />
  </main>
</div>
