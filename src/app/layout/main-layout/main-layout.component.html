<div class="layout-shell min-h-dvh text-estetica-text">
  <a
    href="#conteudo"
    class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:bg-white focus:p-4"
    >Pular para conteúdo</a
  >
  <aside
    class="layout-sidebar border-b border-estetica-secondary bg-white p-4"
  >
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p class="text-lg font-semibold tracking-tight">Clínica de estética</p>
      <p-button class="layout-mobile-logout" label="Sair" icon="pi pi-sign-out"
        severity="danger" [outlined]="true" (onClick)="logout()" [disabled]="state.busy()" />
      <button type="button" class="layout-menu-toggle inline-flex items-center gap-2 rounded-lg border border-estetica-primary px-3 py-2 font-semibold text-estetica-primary"
        (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-controls="navegacao-principal">
        <i [class]="menuOpen() ? 'pi pi-times' : 'pi pi-bars'" aria-hidden="true"></i>
        {{ menuOpen() ? 'Fechar menu' : 'Menu' }}
      </button>
    </div>
    <nav id="navegacao-principal" aria-label="Navegação principal" class="layout-navigation mt-4 gap-2" [class.navigation-open]="menuOpen()">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-estetica-secondary font-semibold"
          ariaCurrentWhenActive="page"
          (click)="menuOpen.set(false)"
          class="flex items-center gap-3 rounded-xl p-3 hover:bg-estetica-secondary focus-visible:outline-2 focus-visible:outline-estetica-text"
        >
          <i [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
      <div class="mt-4 border-t border-estetica-secondary pt-4">
        <p-button
          label="Sair"
          icon="pi pi-sign-out"
          severity="danger"
          [outlined]="true"
          (onClick)="logout()"
          [disabled]="state.busy()"
          styleClass="min-h-11 w-full"
        />
      </div>
    </nav>
  </aside>
  <main id="conteudo" tabindex="-1" class="min-w-0 flex-1 p-4 lg:p-8">
    <app-request-feedback />
    <router-outlet />
  </main>
  <nav aria-label="Navegação inferior" class="bottom-navigation border-t border-estetica-secondary bg-white">
    <div class="bottom-navigation-grid">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="bg-estetica-secondary"
          ariaCurrentWhenActive="page" class="bottom-navigation-item rounded-xl text-estetica-text hover:bg-estetica-secondary">
          <i [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.mobileLabel }}</span>
        </a>
      }
    </div>
  </nav>
  <!-- A cópia invisível mantém a medição mesmo quando a barra dá lugar ao menu. -->
  <div #navigationProbe aria-hidden="true" inert class="bottom-navigation-grid bottom-navigation-probe">
    @for (item of navItems; track item.path) {
      <span class="bottom-navigation-item">
        <i [class]="item.icon"></i>
        <span>{{ item.mobileLabel }}</span>
      </span>
    }
  </div>
</div>
